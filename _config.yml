title: Plates & Psyche
tagline: The science of emotional cravings — why the food we reach for at 2am isn't really about hunger.
description: Issue No. 01 — Comfort Food & Emotional Eating. A Gastronomic Studies group project, rebuilt as a continuous-scroll web magazine.
lang: en

# GitHub Pages project site: https://suryakasyap.github.io/Chef/
url: "https://suryakasyap.github.io"
baseurl: "/Chef"

# Library versions pinned for the CDN script tags (see _includes/scripts.html)
vendor:
  gsap: "3.13.0"
  lenis: "1.3.11"
  three: "0.180.0"

markdown: kramdown
permalink: pretty
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - scripts
  - assets/img/originals   # 40 MB of source photos — never shipped to the site
  - assets/pdf/reference   # the client's source PDF stays in the repo, not on the public site
  - README.md
  - .github
