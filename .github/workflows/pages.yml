# Builds the Jekyll site and publishes the result to the `gh-pages` branch,
# which GitHub Pages serves at https://suryakasyap.github.io/Chef/ .
# Publishing to a branch only needs the default token's `contents: write`,
# so it works without any repository-settings changes (creating a Pages site
# through the API is not allowed for the default Actions token).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/${{ github.event.repository.name }}"
        env:
          JEKYLL_ENV: production
      - name: Publish _site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false   # writes .nojekyll so Pages serves _site as-is
          commit_message: "Publish site build ${{ github.sha }}"
