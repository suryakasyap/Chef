{%- assign im = site.data.images[include.img] -%}
{%- assign base = '/assets/img/magazine/' | append: include.img | relative_url -%}
{%- assign sizes = include.sizes | default: "(min-width: 1100px) 1040px, 92vw" -%}
<figure class="figure {{ include.class }}" data-reveal-img style="aspect-ratio: {{ im.width }} / {{ im.height }}">
  <div class="figure__frame" style="background-image:url({{ im.lqip }})">
    <picture>
      <source type="image/webp" srcset="{% for w in im.sizes %}{{ base }}-{{ w }}.webp {{ w }}w{% unless forloop.last %}, {% endunless %}{% endfor %}" sizes="{{ sizes }}">
      <img src="{{ base }}-{{ im.sizes.last }}.jpg"
           srcset="{% for w in im.sizes %}{{ base }}-{{ w }}.jpg {{ w }}w{% unless forloop.last %}, {% endunless %}{% endfor %}"
           sizes="{{ sizes }}"
           width="{{ im.width }}" height="{{ im.height }}"
           alt="{{ im.alt | escape }}" loading="{{ include.loading | default: 'lazy' }}" decoding="async">
    </picture>
  </div>
  {%- if include.caption -%}<figcaption class="figure__caption">{{ include.caption }}</figcaption>{%- endif -%}
  <span class="figure__credit">{{ im.credit }}</span>
</figure>
