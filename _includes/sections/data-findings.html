<article class="spread" id="data-findings" data-chapter="The Data">
  <div class="spread__inner">
    <header class="spread__head">
      <p class="kicker">The Data</p>
      <h2 class="headline" data-reveal="lines">What the<br>research<br>actually<br>found</h2>
      <p class="dek" data-reveal="up">Two charts, both built directly from Wansink &amp; Sangerman's published figures.</p>
    </header>
    <div class="spread__body">
      <figure class="chart chart--bars" data-chart="bars">
        <ol class="bars" role="list" aria-label="Top comfort foods by share of respondents">
          <li class="bar" style="--v: 24"><span class="bar__val" data-bar-val="24">24%</span><span class="bar__fill" data-bar-fill></span><span class="bar__label">Chips</span></li>
          <li class="bar" style="--v: 14"><span class="bar__val" data-bar-val="14">14%</span><span class="bar__fill" data-bar-fill></span><span class="bar__label">Ice cream</span></li>
          <li class="bar" style="--v: 12"><span class="bar__val" data-bar-val="12">12%</span><span class="bar__fill" data-bar-fill></span><span class="bar__label">Cookies</span></li>
          <li class="bar" style="--v: 11"><span class="bar__val" data-bar-val="11">11%</span><span class="bar__fill" data-bar-fill></span><span class="bar__label">Pizza/<wbr>pasta</span></li>
          <li class="bar" style="--v: 9"><span class="bar__val" data-bar-val="9">9%</span><span class="bar__fill" data-bar-fill></span><span class="bar__label">Steak/<wbr>burgers</span></li>
        </ol>
        <figcaption class="chart__caption">Top comfort foods by share of respondents — Wansink &amp; Sangerman, 2000</figcaption>
      </figure>
      <figure class="chart chart--donut" data-chart="donut">
        <div class="donut">
          <svg class="donut__svg" viewBox="0 0 120 120" role="img" aria-label="Reported emotional context for comfort eating: jubilant mood 86%, celebration or reward 74%, sad or lonely 39%.">
            <circle class="donut__track" cx="60" cy="60" r="48" fill="none" stroke="var(--tan)" stroke-width="14" opacity=".35"/>
            <circle class="donut__seg" data-donut-seg data-share="43" cx="60" cy="60" r="48" fill="none" stroke="var(--espresso)" stroke-width="14" stroke-dasharray="129.685 301.593" stroke-dashoffset="0.000"/>
            <circle class="donut__seg" data-donut-seg data-share="37" cx="60" cy="60" r="48" fill="none" stroke="var(--navy)" stroke-width="14" stroke-dasharray="111.589 301.593" stroke-dashoffset="-129.685"/>
            <circle class="donut__seg" data-donut-seg data-share="20" cx="60" cy="60" r="48" fill="none" stroke="var(--gold)" stroke-width="14" stroke-dasharray="60.319 301.593" stroke-dashoffset="-241.274"/>
          </svg>
          <ul class="legend" data-reveal="stagger" role="list">
            <li><i class="legend__dot" style="--c: var(--espresso)"></i>Jubilant mood — 86%</li>
            <li><i class="legend__dot" style="--c: var(--navy)"></i>Celebration / reward — 74%</li>
            <li><i class="legend__dot" style="--c: var(--gold)"></i>Sad or lonely — 39%</li>
          </ul>
        </div>
        <figcaption class="chart__caption">Reported emotional context for comfort eating — Wansink &amp; Sangerman, 2000. Multiple answers were allowed; the ring shows the three shares relative to each other.</figcaption>
      </figure>
    </div>
  </div>
</article>
