<article class="spread" id="foundations-loop" data-chapter="Foundations">
  <div class="spread__inner">
    <header class="spread__head">
      <p class="kicker">Foundations</p>
      <h2 class="headline" data-reveal="lines">The<br>stress-<br>eating<br>loop</h2>
    </header>
    <div class="spread__body spread__body--center">
      <figure class="loop" data-loop role="img" aria-label="A four-step loop: stress leads to craving, craving to relief, relief to guilt, and guilt back to stress.">
        <svg class="loop__svg" viewBox="0 0 420 420" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="loopArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--espresso)"/>
            </marker>
          </defs>
          <circle class="loop__ring" cx="210" cy="210" r="172" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4 7" data-loop-ring/>
          <path class="loop__arc" data-loop-arc d="M 240 66 A 150 150 0 0 1 354 180" stroke="var(--espresso)" stroke-width="1.6" marker-end="url(#loopArrow)"/>
          <path class="loop__arc" data-loop-arc d="M 354 240 A 150 150 0 0 1 240 354" stroke="var(--espresso)" stroke-width="1.6" marker-end="url(#loopArrow)"/>
          <path class="loop__arc" data-loop-arc d="M 180 354 A 150 150 0 0 1 66 240" stroke="var(--espresso)" stroke-width="1.6" marker-end="url(#loopArrow)"/>
          <path class="loop__arc" data-loop-arc d="M 66 180 A 150 150 0 0 1 180 66" stroke="var(--espresso)" stroke-width="1.6" marker-end="url(#loopArrow)"/>
          <g class="loop__node" data-loop-node><circle cx="210" cy="60" r="40" fill="var(--espresso)"/><text x="210" y="60" fill="var(--cream)">Stress</text></g>
          <g class="loop__node" data-loop-node><circle cx="360" cy="210" r="40" fill="var(--navy)"/><text x="360" y="210" fill="var(--cream)">Craving</text></g>
          <g class="loop__node" data-loop-node><circle cx="210" cy="360" r="40" fill="var(--cocoa)"/><text x="210" y="360" fill="var(--cream)">Relief</text></g>
          <g class="loop__node" data-loop-node><circle cx="60" cy="210" r="40" fill="var(--gold)"/><text x="60" y="210" fill="var(--espresso)">Guilt</text></g>
        </svg>
        <figcaption class="loop__caption" data-reveal="up">Stress triggers a craving, the craving brings short-term relief, relief is often followed by guilt — and guilt itself becomes the next stressor. The loop resets, usually without anyone noticing it's a loop.</figcaption>
      </figure>
    </div>
  </div>
</article>
